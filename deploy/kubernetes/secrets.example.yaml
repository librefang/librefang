# EXAMPLE ONLY — do not apply this file as-is, and do not commit a filled-in
# copy. Every value below is a placeholder. Create the real Secrets with
# `kubectl create secret` (see ../README.md) so the material never enters git.
#
# This file exists to document the exact key names the StatefulSet reads. A
# missing non-optional key makes the pod fail to start with
# `CreateContainerConfigError`, which is deliberate: a daemon on a
# non-loopback bind refuses to boot without authentication (#3572), so failing
# at the kubelet is better than silently running open.
---
apiVersion: v1
kind: Secret
metadata:
  name: librefang-auth
type: Opaque
stringData:
  # API bearer token. Every /api/* call presents this as `Authorization:
  # Bearer <api-key>` unless it is on the public allowlist.
  #   openssl rand -hex 32
  api-key: "REPLACE_ME"

  # Credential-vault master key. MUST base64-decode to exactly 32 bytes —
  # `openssl rand -base64 32` produces a 44-character string that does. Note
  # that 32 ASCII characters are NOT 32 bytes once base64-decoded, a mistake
  # that surfaces as a vault-unlock failure at boot.
  #   openssl rand -base64 32
  vault-key: "REPLACE_ME"

  # Dashboard login. Required for the web UI; also counts as configured
  # authentication for the non-loopback bind guard.
  dashboard-user: "admin"
  dashboard-pass: "REPLACE_ME"

  # HMAC key for OAuth/OIDC state tokens. Same shape as vault-key: base64 that
  # decodes to exactly 32 bytes.
  #
  # Optional only while `[external_auth] enabled = false`, where an absent
  # value means each boot derives a random per-process key — so an external
  # login in flight across a pod replacement fails with "invalid state".
  # With external auth enabled the daemon REFUSES TO BOOT when this is missing
  # or malformed, because a per-process key breaks every callback.
  #   openssl rand -base64 32
  state-secret: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: librefang-providers
type: Opaque
stringData:
  # All optional. Omit the whole Secret to run local-model-only — the
  # StatefulSet marks each of these `optional: true`, so absent keys do not
  # block startup. Add more provider variables as needed; anything the driver
  # reads from the environment works the same way (see the crate docs for
  # librefang-llm-drivers).
  anthropic-api-key: "REPLACE_ME"
  openai-api-key: "REPLACE_ME"
  groq-api-key: "REPLACE_ME"
