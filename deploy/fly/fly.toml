app = "librefang"
primary_region = "nrt"

[build]
image = "ghcr.io/librefang/librefang:v2026.7.31"

[env]
  LIBREFANG_HOME = "/data"
  LIBREFANG_LISTEN = "0.0.0.0:4545"
  # Authentication is required for this public bind.
  # The one-command deploy script provisions LIBREFANG_API_KEY as a Fly secret before first boot.

[http_service]
  internal_port = 4545
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/ready"

  [http_service.checks.headers]
    X-Forwarded-Proto = "https"

[mounts]
  source = "librefang_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
