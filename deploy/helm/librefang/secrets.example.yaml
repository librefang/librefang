# EXAMPLE ONLY — this file is not part of the chart's templates and is never
# rendered. Do not apply it as-is, and do not commit a filled-in copy: every
# value below is a placeholder. The chart deliberately creates no Secret, so a
# credential cannot end up in a values file, in Helm's release storage, or in git.
#
# Workflow:
#   1. cp secrets.example.yaml /tmp/librefang-secrets.yaml   (outside the repo)
#   2. replace every REPLACE_ME, delete what you do not need
#   3. kubectl -n librefang apply -f /tmp/librefang-secrets.yaml && shred/rm it
#   4. helm install ... --set auth.existingSecret=librefang-auth
# or skip the file and use `kubectl create secret generic …` (README.md).
#
# Key names match values.yaml (`auth.keys.*`, `providers.env[].key`,
# `extraEnv`). Change one side and you must change the other.
#
# For GitOps, do not put these in the repo either: use SealedSecrets,
# ExternalSecrets, SOPS or your cloud's secret store to produce a Secret with
# these names and keys.
---
# REQUIRED — referenced by `auth.existingSecret`.
apiVersion: v1
kind: Secret
metadata:
  name: librefang-auth
type: Opaque
stringData:
  # Bearer token for every /api/* call.       openssl rand -hex 32
  api-key: "REPLACE_ME"
  # Credential-vault master key. MUST base64-decode to exactly 32 bytes.
  #                                           openssl rand -base64 32
  vault-key: "REPLACE_ME"
  # Dashboard login.
  dashboard-user: "admin"
  dashboard-pass: "REPLACE_ME"               # openssl rand -hex 24
  # OAuth/OIDC state-signing key, same shape as vault-key. Optional until
  # `[external_auth] enabled = true`; then the daemon refuses to boot without it.
  # state-secret: "REPLACE_ME"               # openssl rand -base64 32
---
# OPTIONAL — referenced by `providers.existingSecret` (default: librefang-providers).
# Omit the whole Secret for a local-model-only cluster: every reference is
# `optional: true`. Keep only the providers you use.
apiVersion: v1
kind: Secret
metadata:
  name: librefang-providers
type: Opaque
stringData:
  anthropic-api-key: "REPLACE_ME"
  openai-api-key: "REPLACE_ME"
  openrouter-api-key: "REPLACE_ME"
  groq-api-key: "REPLACE_ME"
  # Uncomment together with the matching `providers.env` entry in values.yaml.
  # gemini-api-key: "REPLACE_ME"
  # mistral-api-key: "REPLACE_ME"
  # deepseek-api-key: "REPLACE_ME"
  # xai-api-key: "REPLACE_ME"
  # together-api-key: "REPLACE_ME"
  # fireworks-api-key: "REPLACE_ME"
  # cohere-api-key: "REPLACE_ME"
  # perplexity-api-key: "REPLACE_ME"
  # tavily-api-key: "REPLACE_ME"
  # brave-api-key: "REPLACE_ME"
