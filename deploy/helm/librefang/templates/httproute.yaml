{{- if .Values.httpRoute.enabled }}
{{- include "librefang.validateExposure" . }}
{{- $fullName := include "librefang.fullname" . }}
{{- if .Values.httpRoute.httpRedirect.enabled }}
# HTTP -> HTTPS. Attach it to the Gateway's HTTP listener only, or it competes
# with the route below for the HTTPS listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-http-redirect
  labels:
    {{- include "librefang.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.httpRedirect.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml (.Values.httpRoute.httpRedirect.hostnames | default .Values.httpRoute.hostnames) | nindent 4 }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "librefang.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
