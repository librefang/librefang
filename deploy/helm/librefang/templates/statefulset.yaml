{{- include "librefang.validate" . -}}
{{- include "librefang.validateManagedImage" . -}}
{{- $agentsEnabled := and .Values.managedConfig.enabled (not (empty .Values.managedConfig.agents)) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "librefang.fullname" . }}
  labels:
    {{- include "librefang.labels" . | nindent 4 }}
spec:
  # replicas MUST remain 1 — see values.yaml and docs/architecture/multi-replica-rfc.md.
  replicas: 1
  serviceName: {{ include "librefang.headlessName" . }}
  # A StatefulSet terminates its pod before creating the replacement, so two
  # daemons never contend for the ReadWriteOnce volume.
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistence.retentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.persistence.retentionPolicy.whenScaled }}
  selector:
    matchLabels:
      {{- include "librefang.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librefang.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations .Values.managedConfig.enabled }}
      annotations:
        {{- if .Values.managedConfig.enabled }}
        # Editing the ConfigMap must roll the pod: the kubelet syncs the mount
        # within ~1 min but the daemon reads it at boot only. Same string
        # GET /api/config/status reports as `checksum`.
        checksum/config: {{ include "librefang.configChecksum" . | quote }}
        {{- end }}
        {{- if $agentsEnabled }}
        checksum/provisioning: {{ include "librefang.provisioningChecksum" . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "librefang.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # Pod Security Standard `restricted`. See values.yaml.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: librefang
          image: {{ include "librefang.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4545
              protocol: TCP
          env:
            # The container's loopback is unreachable from the kubelet and from
            # other pods, so the daemon must bind the wildcard address.
            - name: LIBREFANG_LISTEN
              value: "0.0.0.0:4545"
            - name: LIBREFANG_HOME
              value: /data
            - name: LIBREFANG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.keys.apiKey }}
            - name: LIBREFANG_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.keys.vaultKey }}
            - name: LIBREFANG_DASHBOARD_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.keys.dashboardUser }}
            - name: LIBREFANG_DASHBOARD_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.keys.dashboardPass }}
            # Optional only while external auth is off; with it on the daemon
            # refuses to boot without a value.
            - name: LIBREFANG_STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.keys.stateSecret }}
                  optional: true
            {{- range .Values.providers.env }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName | default $.Values.providers.existingSecret }}
                  key: {{ .key }}
                  optional: true
            {{- end }}
            {{- if .Values.managedConfig.enabled }}
            - name: LIBREFANG_CONFIG_PATH
              value: /etc/librefang/config.toml
            - name: LIBREFANG_CONFIG_MODE
              value: managed
            {{- end }}
            {{- if $agentsEnabled }}
            - name: LIBREFANG_PROVISIONING_PATH
              value: /etc/librefang/provisioning
            {{- if eq .Values.managedConfig.prune "delete" }}
            - name: LIBREFANG_PROVISIONING_PRUNE
              value: delete
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # startupProbe gates the other two while first boot runs
          # `librefang init`. Liveness asks "is the process wedged?" and must
          # NOT fail for a dependency outage; readiness asks "can it accept
          # work?" and removes the pod from the Service without killing it.
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.managedConfig.enabled }}
            - name: config
              mountPath: /etc/librefang
              readOnly: true
            {{- end }}
            {{- if $agentsEnabled }}
            - name: provisioning
              mountPath: /etc/librefang/provisioning/agents
              readOnly: true
            {{- end }}
      {{- if .Values.managedConfig.enabled }}
      volumes:
        - name: config
          configMap:
            name: {{ include "librefang.configMapName" . }}
            defaultMode: 0444
        {{- if $agentsEnabled }}
        - name: provisioning
          configMap:
            name: {{ include "librefang.agentsConfigMapName" . }}
            defaultMode: 0444
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "librefang.selectorLabels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        # ReadWriteOnce, never ReadWriteMany: SQLite WAL and the daemon.lock
        # flock depend on POSIX locking that shared filesystems often lack.
        accessModes:
          - ReadWriteOnce
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ if eq .Values.persistence.storageClass "-" }}""{{ else }}{{ .Values.persistence.storageClass | quote }}{{ end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
