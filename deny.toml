# cargo-deny configuration — supply-chain audit for the LibreFang workspace.
#
# Schema reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
#
# Run locally with:
#   cargo deny check advisories
#   cargo deny check bans licenses sources
#
# CI runs the same checks on every PR and main push that touches Cargo.toml,
# Cargo.lock, deny.toml, or the workflow itself — see
# .github/workflows/cargo-deny.yml. See CONTRIBUTING.md (§ Dependency policy)
# for the review expectations behind every entry below.

[graph]
# Resolve the dependency graph for every platform we ship to. A crate that
# only compiles on a single target (e.g. windows-only or wasm-only) will
# otherwise be skipped silently and we'd miss license/advisory hits on the
# platforms our users actually run.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[output]
feature-depth = 1

# ─────────────────────────────────────────────────────────────────────────────
# Advisories — RustSec database, blocks yanked / vulnerable crates.
# ─────────────────────────────────────────────────────────────────────────────
[advisories]
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# cargo-deny 0.20.2 RustSec ignores are global by advisory ID and cannot be
# constrained by crate/version. Re-review the full dependency graph whenever
# an ignored advisory appears on a new path. Yank ignores use exact crate versions.
ignore = [
    # All zip 4.x releases are yanked; even tauri-plugin-updater 2.14.0 still requires ^4 on Windows.
    # Remove this exact-version yank exception when the updater supports zip 9; RustSec advisories remain enforced.
    { crate = "zip@4.6.1", reason = "Windows-only tauri-plugin-updater dependency; no non-yanked zip 4.x release exists. https://crates.io/crates/tauri-plugin-updater/2.14.0/dependencies" },
    # ── gtk-rs GTK3 bindings, unmaintained ─────────────────────────────────
    # Transitive via tauri-runtime-wry on Linux only. Cannot upgrade until
    # tauri migrates to GTK4 — track upstream: https://github.com/tauri-apps/tauri/issues/9220
    { id = "RUSTSEC-2024-0411", reason = "gtk unmaintained; transitive via tauri on Linux. https://rustsec.org/advisories/RUSTSEC-2024-0411" },
    { id = "RUSTSEC-2024-0412", reason = "gtk-sys unmaintained; transitive via tauri on Linux. https://rustsec.org/advisories/RUSTSEC-2024-0412" },
    { id = "RUSTSEC-2024-0413", reason = "atk unmaintained; transitive via tauri on Linux. https://rustsec.org/advisories/RUSTSEC-2024-0413" },
    { id = "RUSTSEC-2024-0414", reason = "atk-sys unmaintained; transitive via tauri on Linux. https://rustsec.org/advisories/RUSTSEC-2024-0414" },
    { id = "RUSTSEC-2024-0415", reason = "gdk unmaintained; transitive via tauri on Linux. https://rustsec.org/advisories/RUSTSEC-2024-0415" },
    { id = "RUSTSEC-2024-0416", reason = "gdk-sys unmaintained; transitive via tauri on Linux. https://rustsec.org/advisories/RUSTSEC-2024-0416" },
    { id = "RUSTSEC-2024-0417", reason = "gdkx11 unmaintained; transitive via tauri on Linux. https://rustsec.org/advisories/RUSTSEC-2024-0417" },
    { id = "RUSTSEC-2024-0418", reason = "gdkx11-sys unmaintained; transitive via tauri on Linux. https://rustsec.org/advisories/RUSTSEC-2024-0418" },
    { id = "RUSTSEC-2024-0419", reason = "gdkwayland-sys unmaintained; transitive via tauri on Linux. https://rustsec.org/advisories/RUSTSEC-2024-0419" },
    { id = "RUSTSEC-2024-0420", reason = "gdk-pixbuf unmaintained; transitive via tauri on Linux. https://rustsec.org/advisories/RUSTSEC-2024-0420" },

    # ── wasmtime compilation cache: zstd advisories with no reachable path ──
    # zstd 0.13.3, zstd-safe 7.2.4 and zstd-sys 2.0.16 arrive only through
    # wasmtime-internal-cache, which is inert unless a `wasmtime::Cache` is
    # configured — Librefang never builds one. wasmtime 48-50 all require
    # zstd ^0.13, while the fix needs >=0.14.3 (semver-incompatible), so there
    # is no upgrade path yet. Re-review when wasmtime raises the zstd floor.
    { id = "RUSTSEC-2026-0391", reason = "zstd stream-context leak; only reached through wasmtime-internal-cache, which needs a configured Cache. https://rustsec.org/advisories/RUSTSEC-2026-0391" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe Seekable decompress over-length; only reached through wasmtime-internal-cache, which needs a configured Cache. https://rustsec.org/advisories/RUSTSEC-2026-0398" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe uninitialised memory on failed legacy-frame stream; only reached through wasmtime-internal-cache. https://rustsec.org/advisories/RUSTSEC-2026-0403" },
    { id = "RUSTSEC-2026-0410", reason = "zstd-sys wasm allocator shim; only reached through wasmtime-internal-cache, which needs a configured Cache. https://rustsec.org/advisories/RUSTSEC-2026-0410" },

    # ── Other unmaintained transitive crates ───────────────────────────────
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack; reviewed 2026-08-14, RustSec still lists patched = []. https://rustsec.org/advisories/RUSTSEC-2023-0071" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; transitive. https://rustsec.org/advisories/RUSTSEC-2024-0370" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained; transitive. https://rustsec.org/advisories/RUSTSEC-2025-0057" },
    { id = "RUSTSEC-2025-0075", reason = "unic-* unmaintained (kuchikiki/selectors chain). https://rustsec.org/advisories/RUSTSEC-2025-0075" },
    { id = "RUSTSEC-2025-0080", reason = "unic-* unmaintained (kuchikiki/selectors chain). https://rustsec.org/advisories/RUSTSEC-2025-0080" },
    { id = "RUSTSEC-2025-0081", reason = "unic-* unmaintained (kuchikiki/selectors chain). https://rustsec.org/advisories/RUSTSEC-2025-0081" },
    { id = "RUSTSEC-2025-0098", reason = "unic-* unmaintained (kuchikiki/selectors chain). https://rustsec.org/advisories/RUSTSEC-2025-0098" },
    { id = "RUSTSEC-2025-0100", reason = "unic-* unmaintained (kuchikiki/selectors chain). https://rustsec.org/advisories/RUSTSEC-2025-0100" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitive via pdf-extract -> lopdf, no safe upgrade available. https://rustsec.org/advisories/RUSTSEC-2026-0192" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; transitive via serde_yaml_ng, which has no safe upgrade available. https://rustsec.org/advisories/RUSTSEC-2024-0449" },
    { id = "RUSTSEC-2026-0367", reason = "zip 4.6.1 is reached only through tauri-plugin-updater (2.x and the 3.0 alphas all require zip ^4), whose sole extract() call runs on Windows, after the minisign check against the pubkey pinned in tauri.conf.json; the advisory concerns Unix symlinks and permission bits. The workspace's own zip is 9.x. https://rustsec.org/advisories/RUSTSEC-2026-0367" },
    { id = "RUSTSEC-2026-0368", reason = "zip 4.6.1 is reached only through tauri-plugin-updater (2.x and the 3.0 alphas all require zip ^4), whose sole extract() call runs on Windows, after the minisign check against the pubkey pinned in tauri.conf.json; the advisory concerns Unix symlinks and permission bits. The workspace's own zip is 9.x. https://rustsec.org/advisories/RUSTSEC-2026-0368" },
    { id = "RUSTSEC-2026-0369", reason = "zip 4.6.1 is reached only through tauri-plugin-updater (2.x and the 3.0 alphas all require zip ^4), whose sole extract() call runs on Windows, after the minisign check against the pubkey pinned in tauri.conf.json; the advisory concerns Unix symlinks and permission bits. The workspace's own zip is 9.x. https://rustsec.org/advisories/RUSTSEC-2026-0369" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, merged into zbus 6; transitive via zbus 5 (ksni, notify-rust, tauri-plugin-single-instance), none of which has moved to zbus 6. https://rustsec.org/advisories/RUSTSEC-2026-0370" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, merged into zbus 6; transitive via zbus 5 (ksni, notify-rust, tauri-plugin-single-instance), none of which has moved to zbus 6. https://rustsec.org/advisories/RUSTSEC-2026-0371" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, merged into zbus 6; transitive via zbus 5 (ksni, notify-rust, tauri-plugin-single-instance), none of which has moved to zbus 6. https://rustsec.org/advisories/RUSTSEC-2026-0372" },
]

# ─────────────────────────────────────────────────────────────────────────────
# Licenses — explicit allow-list. Anything not listed fails the check.
# ─────────────────────────────────────────────────────────────────────────────
[licenses]
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
confidence-threshold = 0.8
# Permissive licenses compatible with our own Apache-2.0 / MIT distribution.
# Strong copyleft (GPL, AGPL, LGPL) is intentionally absent — adding one
# requires a maintainer-level decision documented in CONTRIBUTING.md.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    # CDLA-Permissive-2.0 is used by webpki-roots; OSI-approved permissive
    # license compatible with our distribution model.
    "CDLA-Permissive-2.0",
    # Unlicense is used by ksni; OSI-approved public-domain-equivalent permissive license compatible with our distribution model.
    "Unlicense",
]
# Per-crate license clarifications go here. Add only when SPDX detection is
# ambiguous AND the upstream LICENSE file has been read manually.
exceptions = []

# `ring` ships a hand-rolled license file rather than a single SPDX ID;
# this clarification matches the upstream reality (MIT + ISC + OpenSSL).
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ─────────────────────────────────────────────────────────────────────────────
# Bans — duplicate-version, wildcard, and explicit deny / allow lists.
# ─────────────────────────────────────────────────────────────────────────────
[bans]
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
# Workspace currently has many dependencies that legitimately pull in
# different minor versions of shared crates (e.g. tokio-util, hashbrown).
# `warn` flags them in CI logs without failing the build; we revisit the
# duplicate count as part of routine dependency review rather than blocking
# unrelated PRs on a transitive bump. Promote to "deny" once the workspace
# is consolidated.
multiple-versions = "warn"
# Workspace-internal crates depend on each other via `path = "..."` only.
# cargo-deny treats those as wildcard requirements. Although
# `allow-wildcard-paths = true` permits private path dependencies, versioned
# workspace crates are considered public and remain visible as warnings.
# Downgrade to `warn` so wildcards are visible in the log without
# breaking CI; tighten back to `deny` once cargo-deny grows a "private
# workspace" exception or we drop internal version pins.
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
    # `zip` 4.x is pulled in by tauri-plugin-updater (transitive) while our
    # own code uses 9.x. Allow the duplicate until tauri upstream catches up.
    { name = "zip", version = "=4.6.1" },
]
skip-tree = []

# ─────────────────────────────────────────────────────────────────────────────
# Sources — restrict where crates may come from.
# ─────────────────────────────────────────────────────────────────────────────
[sources]
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
# Anything outside crates.io must be explicitly allow-listed. The workspace
# currently has zero git dependencies (verified by `rg 'git\s*=\s*"'` over
# every Cargo.toml at the time of writing); if that ever changes, add the
# repository to `allow-git` together with a comment linking to the upstream
# issue / PR explaining why a published version is not yet usable.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
