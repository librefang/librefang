[workspace]
# Independent of the kernel workspace AND of librefang-sidecar's workspace, so its own target/ stays isolated and downstream Cargo's feature unification picks up only what this adapter needs.

[package]
name = "librefang-sidecar-telegram"
version = "0.1.0"
edition = "2021"
description = "Telegram channel adapter for LibreFang — sidecar binary"
license = "MIT"
repository = "https://github.com/librefang/librefang"
homepage = "https://librefang.ai"
keywords = ["librefang", "sidecar", "telegram", "channel", "bot"]
categories = ["command-line-utilities"]
readme = "README.md"
# Measured against the committed Cargo.lock (#8124): `cargo +1.88 check --locked --all-targets` passes and 1.87 is rejected by the `icu_*` 2.x crates (edition 2024, rust-version 1.88).
# CI re-checks this exact version with `--locked`, so a dependency bump that raises the floor has to raise this number in the same PR.
rust-version = "1.88"

[[bin]]
name = "librefang-sidecar-telegram"
path = "src/main.rs"

[dependencies]
librefang-sidecar = { path = "../librefang-sidecar", version = "0.1.0" }
tokio = { version = "1", features = ["io-std", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-tls so we don't depend on system OpenSSL; json + multipart for Bot API endpoints.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
# regex needed for the markdown parser (inline link / bold / italic patterns) and the HTML sanitiser (tag-allowlist scanner).
regex = "1"
# CommonMark parser for building `InputRichMessage.blocks` (#8015). Declares MSRV 1.71.1,
# well under this crate's floor — the floor is set by `reqwest -> url -> idna -> icu_*`,
# which is where the 1.88 above comes from.
pulldown-cmark = { version = "0.13", default-features = false }
# `once_cell` for the static reaction map and the cached regex set — avoids re-compiling on every send.
once_cell = "1"
