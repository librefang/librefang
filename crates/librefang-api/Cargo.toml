[package]
name = "librefang-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "HTTP/WebSocket API server for the LibreFang Agent OS daemon"
readme = "README.md"

[dependencies]
librefang-types = { path = "../librefang-types" }
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
# webauthn-rs pulls in openssl-sys on every target; vendor unconditionally so cross-compiled release targets don't probe the host's incompatible system library (replaces the Windows-only gate from #6161).
openssl = { version = "0.10", features = ["vendored"] }
librefang-kernel = { path = "../librefang-kernel" }
librefang-acp = { path = "../librefang-acp", features = ["kernel-adapter"] }
agent-client-protocol = { workspace = true }
tokio-util = { workspace = true }
librefang-kernel-handle = { path = "../librefang-kernel-handle" }
librefang-llm-driver = { path = "../librefang-llm-driver" }
librefang-llm-drivers = { path = "../librefang-llm-drivers" }
librefang-memory = { path = "../librefang-memory" }
librefang-channels = { path = "../librefang-channels", default-features = false }
librefang-wire = { path = "../librefang-wire" }
librefang-skills = { path = "../librefang-skills" }
librefang-hands = { path = "../librefang-hands" }
librefang-extensions = { path = "../librefang-extensions" }
librefang-import = { path = "../librefang-import" }
librefang-telemetry = { path = "../librefang-telemetry" }
librefang-http = { path = "../librefang-http" }
anyhow = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
dashmap = { workspace = true }
portable-pty = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { version = "0.25", features = ["serde"] }
tracing = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
webauthn-rs = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
tokio-stream = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
socket2 = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
url = { workspace = true }
psl = { workspace = true }
zip = { workspace = true }
walkdir = { workspace = true }
dirs = { workspace = true }
jsonwebtoken = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
argon2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { version = "5", features = ["axum_extras"] }
include_dir = "0.7"

# Optional telemetry deps (gated behind `telemetry` feature)
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }

[dev-dependencies]
librefang-api = { path = ".", features = ["test-util"] }
tempfile = { workspace = true }
uuid = { workspace = true }
http-body-util = "0.1"
librefang-testing = { path = "../librefang-testing" }
# tool-exec backend integration test (#3332)
librefang-runtime = { path = "../librefang-runtime" }
totp-rs = { workspace = true }
# OIDC `sub` claim enforcement integration test (#5128): generates RSA
# keypairs in-process, signs JWTs with `jsonwebtoken`, and serves the
# resulting JWKS over a local axum listener so `validate_jwt_cached` can
# be driven end-to-end without a live identity provider.
rsa = { workspace = true }
wiremock = "0.6"
# Storage-failure route tests (#6653 / #6654): the goals routes must answer a substrate read failure with a 500 rather than an empty 200, and the only way to make `structured_get` fail from outside `librefang-memory` is to write a non-JSON blob straight through the connection pool that `MemorySubstrate::pool()` already exposes.
# Test-only; the same workspace version the memory crate compiles.
rusqlite = { workspace = true }
tokio-tungstenite = { workspace = true }
# Manifest-parity route tests (#7742): the `manifest_toml` fixtures are serialized
# from a real `AgentManifest` rather than hand-written, so a field rename cannot
# leave the test asserting against a document the production parser no longer
# produces.
toml = { workspace = true }

[features]
# Default = telemetry only. Channel adapters all run as out-of-process
# sidecars (`librefang.sidecar.adapters.*` in the SDK) — the historical
# `core-channels` / `all-channels` / `channel-*` features that gated
# in-process adapters are gone.
default = ["telemetry"]

# OpenTelemetry tracing export + Prometheus metrics
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
]

# Expose test-only utilities and seams to integration tests
test-util = []

# `channel-*` / `core-channels` / `all-channels` /
# `all-channels-no-email` / `mini` removed — every channel adapter
# runs as a sidecar (see `SIDECAR_CATALOG` in `src/routes/channels.rs`
# + the `librefang.sidecar.adapters.*` SDK at `sdk/python/`). The
# `librefang-cli` default-feature reference to `core-channels` and
# the `librefang-desktop` aliases were cleared in the same change;
# `mobile-smoke.yml` no longer passes `-f mobile-no-email`.

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }
libc = "0.2"

# Windows-only: SDDL → SECURITY_DESCRIPTOR for the ACP named-pipe
# listener (#3313). Restricts the pipe DACL to the daemon's owner SID
# so other local users can't connect. The features list is the minimum
# needed for `ConvertStringSecurityDescriptorToSecurityDescriptorW` +
# `SECURITY_ATTRIBUTES` + `LocalFree`. windows-sys is already in the
# dependency tree transitively (tokio uses it on Windows), so adding
# it as a direct dep is essentially free.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[build-dependencies]
# `build.rs` uses `chrono::Utc::now()` to stamp `BUILD_DATE` instead of
# shelling out to `date`, and `which::which("git")` to resolve git on
# PATH instead of invoking it by bare name (refs #5667).
chrono = { workspace = true }
which = { workspace = true }

[lints]
workspace = true
