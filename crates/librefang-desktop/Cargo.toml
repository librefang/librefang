[package]
name = "librefang-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native desktop application for the LibreFang Agent OS (Tauri 2.0)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
librefang-kernel = { path = "../librefang-kernel" }
librefang-api = { path = "../librefang-api", default-features = false }
librefang-types = { path = "../librefang-types" }
librefang-extensions = { path = "../librefang-extensions" }
clap = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Shared: works on desktop and mobile.
# `tauri` appears again in the desktop target block below with extra features —
# Cargo merges features from both entries; mobile gets the base crate only.
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
toml = { workspace = true }
open = "5"

# macOS + Windows desktop: always include `tray-icon` — these platforms use
# native APIs (NSStatusItem / Shell_NotifyIconW), no GTK involved.
[target.'cfg(all(not(any(target_os = "ios", target_os = "android")), not(target_os = "linux")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"

# Linux desktop: same plugin set as macOS/Windows.
# Linux system tray is implemented using `ksni` (pure D-Bus, removing the unmaintained `libappindicator` dependency from the Linux build graph, though GTK3 remains transitive via Tauri's webview runtime).
# Windows and macOS continue to use Tauri's native tray-icon feature.
[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
# We force the `async-io` backend for `ksni` (instead of `tokio` / default features) because the `tokio` backend pulls in `zbus/tokio`, which triggers a nested runtime panic ("Cannot start a runtime from within a runtime") when Tauri/notify-rust invokes blocking session bus connection calls inside a Tokio worker thread.
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
# Mobile-only plugins
tauri-plugin-barcode-scanner = "2"
keyring = "3"

[features]
default = ["librefang-api/default"]
# Tauri uses custom-protocol in production builds
custom-protocol = ["tauri/custom-protocol"]
# Documents the mobile build path (no-op flag, mobile targets are cfg-gated)
mobile = []
# `all-channels` / `mini` / `mobile-no-email` removed — every channel
# adapter is now a sidecar (no Rust feature to gate). CI / packaging
# flavors that referenced these names need to drop the `-f` flag;
# `mobile-smoke.yml`'s `-f mobile-no-email` is removed in the same
# change.

[[bin]]
name = "librefang-desktop"
path = "src/main.rs"

# iOS / Android need the crate exposed as a `staticlib` (linked into the
# native shell by Xcode / Gradle) and a `cdylib` (loaded by the Tauri
# mobile runtime). `lib` (rlib) is kept so the desktop binary in
# src/main.rs can still depend on the library normally. Without these
# extra crate-types, `cargo tauri ios build` fails with
#   "Library not found at .../liblibrefang_desktop.a"
#
# Side effect: desktop builds now also produce the `staticlib` and
# `cdylib` outputs. That adds a non-trivial link step (~10-20% extra
# build time on a clean target/) — worth it for a unified workspace,
# but if the desktop build ever feels slow this is one place to look.
# Cargo doesn't let us conditionalize crate-type on `cfg(mobile)` at
# the manifest layer, so we accept the cost.
[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[lints]
workspace = true
