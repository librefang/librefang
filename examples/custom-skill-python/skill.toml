## Custom Python Skill Example
##
## This skill counts words in a given text and returns basic statistics.
## To test: librefang skill test ./examples/custom-skill-python --input '{"text": "Hello world"}'
##
## For the full reference, see: https://docs.librefang.ai/agent/skills

[skill]
name = "word-counter"
version = "0.1.0"
description = "Count words, sentences, and characters in text."
author = "your-name"
tags = ["text", "utility", "example"]

[runtime]
type = "python"
entry = "main.py"

[[tools.provided]]
name = "count_text_stats"
description = "Count words, sentences, and characters in text."
input_schema = { type = "object", properties = { text = { type = "string", maxLength = 1048576 } }, required = ["text"], additionalProperties = false }
