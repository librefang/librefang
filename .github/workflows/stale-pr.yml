name: Stale PR

# Mark PRs with no activity for 14 days as stale. Runs daily.
# New pushes remove the label immediately; other activity is reconciled daily.

on:
  pull_request:
    paths:
      - '.github/scripts/stale-pr.js'
      - '.github/scripts/tests/stale-pr.test.js'
      - '.github/workflows/stale-pr.yml'
  schedule:
    - cron: '23 3 * * *' # daily at 03:23 UTC
  pull_request_target:
    types: [synchronize] # new push removes stale
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test stale PR API helpers
        run: node .github/scripts/tests/stale-pr.test.js

  stale:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: stale-pr-reconciliation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Manage stale-pr labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { applyEventPull, listOpenPulls, removeLabel } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/stale-pr.js`,
            );
            const LABEL = 'stale-pr';
            const STALE_DAYS = 14;
            const now = Date.now();
            const cutoff = now - STALE_DAYS * 24 * 60 * 60 * 1000;

            // Every surviving event performs a full reconciliation. GitHub
            // concurrency retains only one pending run, so this keeps a newer
            // synchronize event from discarding another PR's pending cleanup.
            // Prefer the event PR over a potentially stale list snapshot.
            const prs = applyEventPull(
              await listOpenPulls(github, context.repo),
              context.payload.pull_request,
            );

            for (const pr of prs) {
              const updatedAt = new Date(pr.updated_at).getTime();
              const labels = pr.labels.map(l => l.name);
              const hasLabel = labels.includes(LABEL);

              if (updatedAt < cutoff && !hasLabel) {
                // Skip draft PRs
                if (pr.draft) continue;
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: [LABEL],
                });
                core.info(`#${pr.number}: added "${LABEL}" (last updated ${pr.updated_at})`);
              } else if (updatedAt >= cutoff && hasLabel) {
                await removeLabel(github, context.repo, pr.number, LABEL, core);
                core.info(`#${pr.number}: removed "${LABEL}" (recently updated)`);
              }
            }
