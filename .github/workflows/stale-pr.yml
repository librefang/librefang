name: Stale PR

# Mark PRs with no activity for 14 days as stale.
# Runs daily. Removes the label when new activity is detected.

on:
  schedule:
    - cron: '23 3 * * *' # daily at 03:23 UTC
  pull_request_target:
    types: [synchronize] # new push removes stale
  workflow_dispatch:

permissions:
  pull-requests: write

# Two paths with different safety properties share this workflow.
# The `pull_request_target` path only removes `stale-pr` from the single PR that was pushed to, so it is idempotent and safe to cancel — the newer push repeats the same removal.
# The `schedule` / `workflow_dispatch` path sweeps up to 100 open PRs and adds or removes a label one PR at a time, so cancelling it mid-flight would leave a partially swept repository; every sweep shares the constant `sweep` group key and is never cancelled, which makes two overlapping cron fires serialise instead of racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Manage stale-pr labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const LABEL = 'stale-pr';
            const STALE_DAYS = 14;
            const now = Date.now();
            const cutoff = now - STALE_DAYS * 24 * 60 * 60 * 1000;

            // On synchronize event: remove stale label from the pushed PR
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              const labels = pr.labels.map(l => l.name);
              if (labels.includes(LABEL)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: LABEL,
                }).catch(() => {});
                core.info(`#${pr.number}: removed "${LABEL}" (new push)`);
              }
              return;
            }

            // On schedule/dispatch: scan all open PRs
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'asc',
              per_page: 100,
            });

            for (const pr of prs) {
              const updatedAt = new Date(pr.updated_at).getTime();
              const labels = pr.labels.map(l => l.name);
              const hasLabel = labels.includes(LABEL);

              if (updatedAt < cutoff && !hasLabel) {
                // Skip draft PRs
                if (pr.draft) continue;
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: [LABEL],
                });
                core.info(`#${pr.number}: added "${LABEL}" (last updated ${pr.updated_at})`);
              } else if (updatedAt >= cutoff && hasLabel) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: LABEL,
                }).catch(() => {});
                core.info(`#${pr.number}: removed "${LABEL}" (recently updated)`);
              }
            }
