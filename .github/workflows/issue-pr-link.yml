name: Issue-PR Link Labels

# When a PR is opened/edited that references an issue (via "Closes #N",
# "Fixes #N", etc.), reconcile "has-pr" against every open PR. Merge,
# close, reopen, and body edits all use the same source-of-truth scan.

on:
  pull_request:
    paths:
      - '.github/scripts/issue-pr-links.js'
      - '.github/scripts/tests/issue-pr-links.test.js'
      - '.github/workflows/issue-pr-link.yml'
  pull_request_target:
    types: [opened, edited, closed, reopened]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test issue link parser and API error handling
        run: node .github/scripts/tests/issue-pr-links.test.js

  link:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    concurrency:
      group: issue-pr-link-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sync has-pr label on linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { extractIssueNumbers, getIssueOrNull, hasOpenPeerLink } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-pr-links.js`,
            );
            const LABEL = 'has-pr';
            const pr = context.payload.pull_request;
            const currentNumbers = extractIssueNumbers(pr.body, context.repo);
            const previousNumbers = extractIssueNumbers(
              context.payload.changes?.body?.from,
              context.repo,
            );
            const issueNumbers = new Set([...currentNumbers, ...previousNumbers]);

            if (issueNumbers.size === 0) {
              core.info('No linked issues found in PR body');
              return;
            }

            // One paginated snapshot is the source of truth for every issue.
            // Include the event PR explicitly while open in case list indexing
            // trails the opened/reopened webhook by a moment.
            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            for (const num of issueNumbers) {
              const issue = await getIssueOrNull(github, context.repo, num);
              if (!issue) {
                core.info(`Issue #${num}: not found, skipping`);
                continue;
              }
              if (issue.pull_request) {
                core.info(`#${num}: linked target is a PR, skipping`);
                continue;
              }
              const labels = issue.labels.map(l => l.name);
              const hasLabel = labels.includes(LABEL);
              const linkedByCurrent = pr.state === 'open' && currentNumbers.has(num);
              // The list endpoint can lag a body-edit webhook. Exclude the
              // event PR so its authoritative webhook body handles additions
              // and removals while the snapshot represents peers only.
              const linkedBySnapshot = hasOpenPeerLink(
                openPrs,
                num,
                context.repo,
                pr.number,
              );
              const shouldHaveLabel = issue.state === 'open' && (linkedByCurrent || linkedBySnapshot);

              if (shouldHaveLabel && !hasLabel) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  labels: [LABEL],
                });
                core.info(`Issue #${num}: added "${LABEL}"`);
              } else if (!shouldHaveLabel && hasLabel) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  name: LABEL,
                });
                core.info(`Issue #${num}: removed "${LABEL}" (no open linked PR)`);
              }
            }
