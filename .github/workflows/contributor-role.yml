name: Contributor Role

on:
  pull_request:
    paths:
      - '.github/scripts/contributor-announcement.sh'
      - '.github/scripts/tests/contributor-announcement.test.sh'
      - '.github/workflows/contributor-role.yml'
  pull_request_target:
    types: [closed]

# Tighten the default GITHUB_TOKEN scope. This workflow only:
#   - reads PR metadata from the event payload
#   - issues a read-only GitHub Search API call
#   - posts to a Discord webhook
# The privileged job never writes to the repository or opens, labels, or comments on PRs.
# The PR validation job checks out untrusted code with read-only permissions
# and no secrets. The announcement job checks out only the default branch.
# Anything more than read is excess privilege under `pull_request_target`.
# See #3547.
permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse announcement helper and tests
        run: |
          bash -n .github/scripts/contributor-announcement.sh
          sh -n .github/scripts/tests/contributor-announcement.test.sh
      - name: Run announcement tests
        run: .github/scripts/tests/contributor-announcement.test.sh

  assign-role:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Announce in Discord
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          bash .github/scripts/contributor-announcement.sh
