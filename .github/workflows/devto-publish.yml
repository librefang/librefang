name: Publish to Dev.to

on:
  pull_request:
    paths:
      - 'articles/*.md'
      - '.github/scripts/publish-devto.rb'
      - '.github/scripts/test-publish-devto.rb'
      - '.github/workflows/devto-publish.yml'
  push:
    branches: [main]
    paths:
      - 'articles/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devto-publish-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test publisher
        run: ruby .github/scripts/test-publish-devto.rb

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish articles
        shell: bash
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: ruby .github/scripts/publish-devto.rb articles/*.md
