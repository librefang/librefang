name: Update OpenRouter Model Snapshot

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  # Do not interrupt a run after it has pushed or opened its update PR.
  cancel-in-progress: false

jobs:
  update:
    name: Refresh OpenRouter model snapshot
    if: github.repository == 'librefang/librefang'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download deterministic snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot_path=crates/librefang-runtime/openrouter-models.snapshot.json
          snapshot=$(mktemp "${snapshot_path}.XXXXXX")
          trap 'rm -f "$snapshot"' EXIT

          curl --fail --retry 3 --silent --show-error \
            https://openrouter.ai/api/v1/models \
            | jq -c '{data: [.data[] | {id, name, context_length, architecture, supported_parameters, top_provider, pricing}]}' \
            > "$snapshot"

          jq -e '
            def nonblank_string: type == "string" and test("\\S");
            def canonical_id:
              nonblank_string and . == (sub("^\\s+"; "") | sub("\\s+$"; ""));
            .data as $models |
            ($models | type == "array" and length > 0) and
            ([$models[].id] | length == (unique | length)) and
            all($models[];
              (.id | canonical_id) and
              (.name | nonblank_string) and
              (.context_length | type == "number" and . > 0 and floor == .)
            )
          ' "$snapshot" > /dev/null

          mv -- "$snapshot" "$snapshot_path"

      - name: Create update PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Create the PR with a PAT, not the default GITHUB_TOKEN.
          # Branch pushes made by GITHUB_TOKEN do not trigger `on: pull_request` workflows (GitHub's recursion guard), so CI — and the required "CI Gate" status check — would never run on this PR, leaving it permanently unmergeable.
          # WEBSITE_REPO_TOKEN must be a fine-grained PAT limited to this repository with Contents and Pull requests: write.
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          branch: chore/update-openrouter-model-snapshot
          commit-message: "chore(openrouter): update model snapshot"
          title: "chore(openrouter): update model snapshot"
          body: |
            Updates the checked-in OpenRouter model snapshot used as the offline fallback.

            The runtime live catalog remains authoritative when OpenRouter is configured.
          delete-branch: true

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        # The `main` ruleset requires the "CI Gate" check and has an empty bypass_actors list, so `--admin` cannot force the merge — it fails with "Required status check 'CI Gate' is expected" while CI is still pending.
        # Enable auto-merge instead; GitHub squash-merges the PR on its own once CI Gate passes (0 approvals are required).
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --squash --delete-branch --auto; then
              exit 0
            fi
            if (( attempt < 3 )); then
              sleep $((attempt * 5))
            fi
          done
          echo "Auto-merge enable failed; PR #$PR_NUMBER remains open" >&2
          exit 1
