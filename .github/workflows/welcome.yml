name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: read

# A greeting is a one-shot side effect, so this group never cancels: killing a run that has already posted, or dropping one that has not yet, is not something a later run repairs.
# The group is per PR / issue rather than workflow-wide on purpose — GitHub keeps only one pending run per concurrency group and cancels any earlier pending one, so a single shared group would silently drop the greeting for every contributor who opened a PR while another greeting was still in flight.
# PRs and issues share one number space within a repository, so the two triggers cannot collide on the same group key.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Welcome first-time contributors
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.sender.login }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issues" ]; then
            NUMBER="$ISSUE_NUMBER"
            # Exclude the event issue explicitly so delayed indexing cannot make a returning author look new.
            PRIOR_COUNT=$(gh issue list --repo "$REPO" --author "$AUTHOR" --state all --limit 2 --json number | jq --argjson current "$NUMBER" '[.[] | select(.number != $current)] | length')
            if [ "$PRIOR_COUNT" -eq 0 ]; then
              BODY_FILE=$(mktemp)
              trap 'rm -f "$BODY_FILE"' EXIT
              cat > "$BODY_FILE" <<'MSG'
          Thanks for opening your first issue! 🎉

          A maintainer will take a look soon. In the meantime:
          - Check [Discussions](https://github.com/librefang/librefang/discussions) for Q&A
          - Read our [Contributing Guide](https://github.com/librefang/librefang/blob/main/CONTRIBUTING.md) if you'd like to submit a fix

          We aim to respond within 7 days.
          MSG
              gh issue comment "$NUMBER" --repo "$REPO" --body-file "$BODY_FILE"
              rm -f "$BODY_FILE"
              trap - EXIT
            fi

          elif [ "$EVENT_NAME" = "pull_request_target" ]; then
            NUMBER="$PR_NUMBER"
            # Exclude the event PR explicitly so delayed indexing cannot make a returning author look new.
            PRIOR_COUNT=$(gh pr list --repo "$REPO" --author "$AUTHOR" --state all --limit 2 --json number | jq --argjson current "$NUMBER" '[.[] | select(.number != $current)] | length')
            if [ "$PRIOR_COUNT" -eq 0 ]; then
              BODY_FILE=$(mktemp)
              trap 'rm -f "$BODY_FILE"' EXIT
              cat > "$BODY_FILE" <<'MSG'
          Thanks for your first pull request! 🎉

          A maintainer will review it soon. While you wait, please make sure:
          - [ ] PR title follows conventional format (`feat:`, `fix:`, `docs:`, etc.)
          - [ ] `cargo test -p <affected-crate>` passes
          - [ ] `cargo clippy --workspace --all-targets -- -D warnings` is clean

          We aim to provide initial feedback within 7 days. See [CONTRIBUTING.md](https://github.com/librefang/librefang/blob/main/CONTRIBUTING.md) for details.
          MSG
              gh pr comment "$NUMBER" --repo "$REPO" --body-file "$BODY_FILE"
              rm -f "$BODY_FILE"
              trap - EXIT
            fi
          fi
