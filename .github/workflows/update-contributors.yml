name: Update Contributors & Star History

on:
  schedule:
    - cron: "0 8 * * *"  # Daily 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  # A run may already have pushed or opened its PR. Let it finish before the
  # next reconciliation instead of cancelling halfway through the mutation.
  cancel-in-progress: false

jobs:
  update:
    name: Refresh contributors and star history
    if: github.repository == 'librefang/librefang'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
        with:
          shared-key: contributors
      - name: Generate contributors and star history SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask contributors --repo librefang/librefang

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with updated SVGs
        if: steps.diff.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Create the PR with a PAT, not the default GITHUB_TOKEN. Branch
          # pushes made by GITHUB_TOKEN do not trigger `on: pull_request`
          # workflows (GitHub's recursion guard), so CI — and the required
          # "CI Gate" status check — would never run on this PR, leaving it
          # permanently unmergeable.
          # WEBSITE_REPO_TOKEN must be a fine-grained PAT limited to this repository with Contents and Pull requests: write.
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          branch: chore/update-contributors-star-history
          commit-message: "docs: update contributors and star history"
          title: "docs: update contributors and star history"
          delete-branch: true

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        # The `main` ruleset requires the "CI Gate" check and has an empty
        # bypass_actors list, so `--admin` cannot force the merge — it fails
        # with "Required status check 'CI Gate' is expected" while CI is still
        # pending. Enable auto-merge instead; GitHub squash-merges the PR on
        # its own once CI Gate passes (0 approvals are required).
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --squash --delete-branch --auto; then
              exit 0
            fi
            if (( attempt < 3 )); then
              sleep $((attempt * 5))
            fi
          done
          echo "Auto-merge enable failed; PR #$PR_NUMBER remains open" >&2
          exit 1
