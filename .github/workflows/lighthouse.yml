name: Lighthouse

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Repository-wide migration guard from #6675. Pinned actions currently
    # support Node 24; keep them off the runner's legacy Node 20 fallback.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # setup-node's `cache: pnpm` runs `pnpm store path --silent` from the
      # repo root to compute the cache directory. Our `packageManager` field
      # lives in web/package.json, so corepack at the root falls back to the
      # runner image's default pnpm 11 and records `~/.local/share/pnpm/store/v11`.
      # The actual install (`cd web && pnpm install`) then runs pnpm 10.32.1,
      # which writes to `…/store/v10`. Post-job cache save then errors with
      # "Path Validation Error" because the v11 directory was never populated.
      # Pin pnpm explicitly via web/package.json so PATH carries the right
      # version before setup-node's cache pre-step runs.
      - name: Install pnpm (version from web/package.json packageManager)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: web/package.json
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: "web/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        run: cd web && pnpm install --frozen-lockfile

      - name: Build
        run: cd web && pnpm build

      - name: Report Lighthouse annotation mode
        env:
          # PR-controlled install/build scripts run earlier in this job.
          # Expose the annotation credential only on trusted manual runs.
          LHCI_GITHUB_APP_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.LHCI_GITHUB_APP_TOKEN || '' }}
        run: |
          if [ -z "$LHCI_GITHUB_APP_TOKEN" ]; then
            echo "::warning::LHCI_GITHUB_APP_TOKEN is unavailable; running assertions without GitHub annotations"
          else
            echo "Lighthouse GitHub annotations are enabled"
          fi

      - name: Run Lighthouse CI
        run: |
          cd web
          pnpm exec lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.LHCI_GITHUB_APP_TOKEN || '' }}
