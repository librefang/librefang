name: Dashboard Build

# `release: published` requires release-create.yml to use a PAT — releases
# created by GITHUB_TOKEN do not fire downstream triggers.
on:
  push:
    branches: [main]
    paths:
      - 'crates/librefang-api/dashboard/src/**'
      - 'crates/librefang-api/dashboard/package.json'
      - 'crates/librefang-api/dashboard/pnpm-lock.yaml'
      - 'crates/librefang-api/dashboard/vite.config.*'
      - 'crates/librefang-api/dashboard/tsconfig.*'
      - 'crates/librefang-api/dashboard/eslint.config.*'
      - '.github/scripts/dashboard-release-tag.sh'
      - '.github/scripts/tests/dashboard-release-tag.test.sh'
      - '.github/workflows/dashboard-build.yml'
  pull_request:
    paths:
      - 'crates/librefang-api/dashboard/src/**'
      - 'crates/librefang-api/dashboard/package.json'
      - 'crates/librefang-api/dashboard/pnpm-lock.yaml'
      - 'crates/librefang-api/dashboard/vite.config.*'
      - 'crates/librefang-api/dashboard/tsconfig.*'
      - 'crates/librefang-api/dashboard/eslint.config.*'
      - '.github/scripts/dashboard-release-tag.sh'
      - '.github/scripts/tests/dashboard-release-tag.test.sh'
      - '.github/workflows/dashboard-build.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload dashboard asset to (e.g. v2026.4.5-beta.14)'
        required: true
        type: string

# Cancel superseded runs on the same ref (e.g. when a PR is force-pushed).
# Main-branch and release runs each get their own group so they don't cancel
# each other.
concurrency:
  group: dashboard-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Dashboard Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ESLint guards security-sensitive JSX (jsx-no-target-blank,
    # no-danger-with-children) and acts as a fast pre-build gate so the
    # heavier typecheck + build jobs don't waste a runner on a PR that
    # would have failed the lint anyway (refs #5561).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test release tag selection
        run: .github/scripts/tests/dashboard-release-tag.test.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: crates/librefang-api/dashboard
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
      - name: Lint
        working-directory: crates/librefang-api/dashboard
        run: pnpm run lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: crates/librefang-api/dashboard
        # pnpm 10 in CI ignores both .npmrc and pnpm-workspace.yaml for the
        # ignored-builds setting; pass it on the CLI so it can't be missed.
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Typecheck
        working-directory: crates/librefang-api/dashboard
        run: pnpm run typecheck

      - name: Run tests
        working-directory: crates/librefang-api/dashboard
        # Includes the no-inline-fetch lint test (src/lib/__tests__/no-inline-fetch.test.ts)
        run: pnpm run test

      - name: Build dashboard
        working-directory: crates/librefang-api/dashboard
        run: pnpm run build

      - name: Package dashboard assets
        if: github.event_name != 'pull_request'
        run: |
          cd crates/librefang-api/static/react
          tar -czf /tmp/dashboard-dist.tar.gz .

      - name: Retain packaged dashboard
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-release-asset
          path: /tmp/dashboard-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  upload:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dashboard-release-asset
          path: /tmp
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=$(sh .github/scripts/dashboard-release-tag.sh)
          if [ -z "$TAG" ]; then
            echo "No stable release found, skipping upload"
            exit 0
          fi
          echo "Uploading dashboard-dist.tar.gz to $TAG"
          for attempt in $(seq 1 5); do
            if gh release upload --repo "$REPOSITORY" --clobber -- \
              "$TAG" /tmp/dashboard-dist.tar.gz; then
              echo "✓ Upload succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Upload failed (attempt $attempt/5), retrying in 10s..."
            sleep 10
          done
          echo "::error::Upload failed after 5 attempts"
          exit 1
