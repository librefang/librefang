        run: cargo install cross --locked
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
        with:
          key: cli-${{ matrix.target }}-${{ inputs.tag }}
          # Cache the kernel workspace AND the sidecar's separate target/.
          workspaces: |
            .
            sdk/rust/librefang-sidecar-telegram
      - name: Build static CLI
        run: cross build --release --target ${{ matrix.target }} --bin librefang
      - name: Build Telegram sidecar
        # Separate cargo workspace → separate target/ under the manifest dir.
        run: cross build --release --target ${{ matrix.target }} --manifest-path sdk/rust/librefang-sidecar-telegram/Cargo.toml
      - name: Verify static linking
        run: |
          FILE_OUT=$(file target/${{ matrix.target }}/release/librefang)
          echo "$FILE_OUT"
          if ! echo "$FILE_OUT" | grep -qE "statically linked|static-pie linked"; then
            echo "::error::Binary is not statically linked!"
            exit 1
          fi
          SIDECAR_OUT=$(file sdk/rust/librefang-sidecar-telegram/target/${{ matrix.target }}/release/librefang-sidecar-telegram)
          echo "$SIDECAR_OUT"
          if ! echo "$SIDECAR_OUT" | grep -qE "statically linked|static-pie linked"; then
            echo "::error::Sidecar binary is not statically linked!"
            exit 1
          fi
      - name: Package
        run: |
          cp sdk/rust/librefang-sidecar-telegram/target/${{ matrix.target }}/release/librefang-sidecar-telegram target/${{ matrix.target }}/release/librefang-sidecar-telegram
          cd target/${{ matrix.target }}/release
          tar czf ../../../librefang-${{ matrix.target }}.tar.gz librefang librefang-sidecar-telegram
          cd ../../..
          sha256sum librefang-${{ matrix.target }}.tar.gz > librefang-${{ matrix.target }}.tar.gz.sha256
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 5); do
            if gh release upload "$RELEASE_TAG" librefang-${{ matrix.target }}.* --clobber; then
              echo "✓ Upload succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Upload failed (attempt $attempt/5), retrying in 10s..."
            sleep 10
          done
          echo "::error::Upload failed after 5 attempts"
          exit 1

  cli_windows:
    name: CLI / ${{ matrix.target }}
    needs: [build_dashboard]
    runs-on: windows-latest
    timeout-minutes: 240
    environment: release-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
          - target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
