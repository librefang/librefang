name: release-cli

# Manual CLI rebuild + re-upload. Issue #3304 1/N (non-destructive split).
#
# Mirrors the cli_* + sign_release_artifacts + cli_npm + cli_pypi +
# sync_homebrew jobs in release.yml. release.yml stays the canonical
# entrypoint on tag push — this workflow is for "an artifact failed and
# I just want to redo the CLI slice without rerunning the entire 30-job
# release pipeline".
#
# Inputs:
#   tag          — existing release tag to (re)build for, e.g. v2026.5.4
#   include_pypi — also re-publish the CLI PyPI wheels (off by default)
#
# Maintainer must configure the `release-cli` GitHub environment (with
# required reviewers) before this stub becomes useful for redirecting
# real release traffic — see docs/operations/release.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild for (e.g. v2026.5.4)'
        required: true
        type: string
      include_pypi:
        description: 'Re-publish CLI PyPI wheels (the JS npm binary side lives in release-npm-binaries.yml)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Match release.yml's `release-${{ github.ref }}` value for a tag push so a
  # manual repair cannot clobber assets while the canonical release is active.
  group: release-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate_release_tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate release tag format
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -qE '^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(-(beta|rc)\.?[0-9]+|-lts)?$'; then
            echo "::error::tag '$RELEASE_TAG' does not match expected CalVer pattern"
            exit 1
          fi
      - name: Verify release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! ACTUAL_TAG=$(gh release view "$RELEASE_TAG" --json tagName --jq '.tagName'); then
            echo "::error::release '$RELEASE_TAG' does not exist"
            exit 1
          fi
          if [ "$ACTUAL_TAG" != "$RELEASE_TAG" ]; then
            echo "::error::release lookup returned '$ACTUAL_TAG' instead of '$RELEASE_TAG'"
            exit 1
          fi

  build_dashboard:
    name: Build Dashboard
    needs: [validate_release_tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: crates/librefang-api/dashboard
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
      - name: Build dashboard
        working-directory: crates/librefang-api/dashboard
        run: pnpm run build
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-dist
          path: crates/librefang-api/static/react/
          retention-days: 1

  cli_mac:
    name: CLI / ${{ matrix.target }}
    needs: [build_dashboard]
    runs-on: macos-latest
    timeout-minutes: 240
    environment: release-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
          - target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dashboard-dist
          path: crates/librefang-api/static/react/
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      # The pinned toolchain needs the target too — see the note in release.yml's `cli_mac` job.
      - name: Add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
        with:
          key: cli-${{ matrix.target }}-${{ inputs.tag }}
          # Cache the kernel workspace AND the sidecar's separate target/.
          workspaces: |
            .
            sdk/rust/librefang-sidecar-telegram
      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} --bin librefang
      - name: Build Telegram sidecar
        # Separate cargo workspace → separate target/ under the manifest dir.
        run: cargo build --release --target ${{ matrix.target }} --manifest-path sdk/rust/librefang-sidecar-telegram/Cargo.toml
      - name: Ad-hoc codesign
        run: |
          xattr -cr target/${{ matrix.target }}/release/librefang || true
          codesign --force --sign - target/${{ matrix.target }}/release/librefang
          SIDECAR=sdk/rust/librefang-sidecar-telegram/target/${{ matrix.target }}/release/librefang-sidecar-telegram
          xattr -cr "$SIDECAR" || true
          codesign --force --sign - "$SIDECAR"
      - name: Package
        run: |
          cp sdk/rust/librefang-sidecar-telegram/target/${{ matrix.target }}/release/librefang-sidecar-telegram target/${{ matrix.target }}/release/librefang-sidecar-telegram
          cd target/${{ matrix.target }}/release
          tar czf ../../../librefang-${{ matrix.target }}.tar.gz librefang librefang-sidecar-telegram
          cd ../../..
          shasum -a 256 librefang-${{ matrix.target }}.tar.gz > librefang-${{ matrix.target }}.tar.gz.sha256
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 5); do
            if gh release upload "$RELEASE_TAG" librefang-${{ matrix.target }}.* --clobber; then
              echo "✓ Upload succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Upload failed (attempt $attempt/5), retrying in 10s..."
            sleep 10
          done
          echo "::error::Upload failed after 5 attempts"
          exit 1

  cli_linux:
    name: CLI / ${{ matrix.target }}
    needs: [build_dashboard]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment: release-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dashboard-dist
          path: crates/librefang-api/static/react/
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      # The pinned toolchain needs the target too — see the note in release.yml's `cli_mac` job.
      - name: Add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
        with:
          key: cli-${{ matrix.target }}-${{ inputs.tag }}
          # Cache the kernel workspace AND the sidecar's separate target/.
          workspaces: |
            .
            sdk/rust/librefang-sidecar-telegram
      - name: Build CLI
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin librefang
          else
            cargo build --release --target ${{ matrix.target }} --bin librefang
          fi
      - name: Build Telegram sidecar
        # Separate cargo workspace → separate target/ under the manifest dir.
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --manifest-path sdk/rust/librefang-sidecar-telegram/Cargo.toml
          else
            cargo build --release --target ${{ matrix.target }} --manifest-path sdk/rust/librefang-sidecar-telegram/Cargo.toml
          fi
      - name: Package
        run: |
          cp sdk/rust/librefang-sidecar-telegram/target/${{ matrix.target }}/release/librefang-sidecar-telegram target/${{ matrix.target }}/release/librefang-sidecar-telegram
          cd target/${{ matrix.target }}/release
          tar czf ../../../librefang-${{ matrix.target }}.tar.gz librefang librefang-sidecar-telegram
          cd ../../..
          sha256sum librefang-${{ matrix.target }}.tar.gz > librefang-${{ matrix.target }}.tar.gz.sha256
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 5); do
            if gh release upload "$RELEASE_TAG" librefang-${{ matrix.target }}.* --clobber; then
              echo "✓ Upload succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Upload failed (attempt $attempt/5), retrying in 10s..."
            sleep 10
          done
          echo "::error::Upload failed after 5 attempts"
          exit 1

  cli_android:
    name: CLI / aarch64-linux-android
    needs: [build_dashboard]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment: release-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dashboard-dist
          path: crates/librefang-api/static/react/
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cross
        run: cargo install cross --locked
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
        with:
          key: cli-aarch64-linux-android-${{ inputs.tag }}
      - name: Build CLI (Android aarch64)
        # Every channel adapter is a Python sidecar now; no per-channel
        # cargo features remain to gate. The previous `--features android`
        # collapsed `librefang-api/all-channels` without channel-email
        # (rustls-connector 0.23.0 → rustls-platform-verifier 0.7.0
        # missing on Android), now obsolete.
        run: cross build --release --target aarch64-linux-android --bin librefang --no-default-features --features telemetry
      - name: Package
        run: |
          cd target/aarch64-linux-android/release
          tar czf ../../../librefang-aarch64-linux-android.tar.gz librefang
          cd ../../..
          sha256sum librefang-aarch64-linux-android.tar.gz > librefang-aarch64-linux-android.tar.gz.sha256
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 5); do
            if gh release upload "$RELEASE_TAG" librefang-aarch64-linux-android.* --clobber; then
              echo "✓ Upload succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Upload failed (attempt $attempt/5), retrying in 10s..."
            sleep 10
          done
          echo "::error::Upload failed after 5 attempts"
          exit 1

  cli_linux_mini:
    name: CLI / ${{ matrix.target }} (mini)
    needs: [build_dashboard]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment: release-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
