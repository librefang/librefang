        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 5); do
            if gh release upload "$RELEASE_TAG" librefang-${{ matrix.target }}-mini.* --clobber; then
              echo "✓ Upload succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Upload failed (attempt $attempt/5), retrying in 10s..."
            sleep 10
          done
          echo "::error::Upload failed after 5 attempts"
          exit 1

  sign_release_artifacts:
    name: Sign Release Artifacts
    needs:
      - cli_mac
      - cli_linux
      - cli_android
      - cli_linux_mini
      - cli_musl
      - cli_windows
      - cli_mac_mini
      - cli_windows_mini
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-cli
    permissions:
      contents: write
      id-token: write
    env:
      # One entry per target across the cli_* jobs, matching release.yml's EXPECTED_PLATFORMS count.
      # `test_release_tag_workflow_safety.py` fails when the two disagree, so a new matrix target
      # cannot reach one workflow without the other.
      EXPECTED_CHECKSUM_ASSETS: |
        librefang-aarch64-apple-darwin.tar.gz.sha256
        librefang-aarch64-linux-android.tar.gz.sha256
        librefang-aarch64-pc-windows-msvc.zip.sha256
        librefang-aarch64-unknown-linux-gnu.tar.gz.sha256
        librefang-aarch64-unknown-linux-musl.tar.gz.sha256
        librefang-x86_64-apple-darwin-mini.tar.gz.sha256
        librefang-x86_64-apple-darwin.tar.gz.sha256
        librefang-x86_64-pc-windows-msvc-mini.zip.sha256
        librefang-x86_64-pc-windows-msvc.zip.sha256
        librefang-x86_64-unknown-linux-gnu-mini.tar.gz.sha256
        librefang-x86_64-unknown-linux-gnu.tar.gz.sha256
        librefang-x86_64-unknown-linux-musl.tar.gz.sha256
      ALLOWED_SYMBOL_CHECKSUM_ASSETS: |
        librefang-aarch64-apple-darwin-debug-symbols.tar.gz.sha256
        librefang-aarch64-unknown-linux-gnu-debug-symbols.tar.gz.sha256
        librefang-x86_64-apple-darwin-debug-symbols.tar.gz.sha256
        librefang-x86_64-unknown-linux-gnu-debug-symbols.tar.gz.sha256
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.3"
      - name: Build SHA256SUMS manifest from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sums
          cd sums
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name | select(endswith(".sha256")) | select(. != "SHA256SUMS")' \
            > asset-list.txt
          if [ ! -s asset-list.txt ]; then
            echo "::error::no *.sha256 sibling files attached to release $RELEASE_TAG"
            exit 1
          fi
          grep -v -- '-debug-symbols\.tar\.gz\.sha256$' asset-list.txt | sort -u > platform-assets.txt || true
          grep -- '-debug-symbols\.tar\.gz\.sha256$' asset-list.txt | sort -u > symbol-assets.txt || true
          printf '%s\n' "$EXPECTED_CHECKSUM_ASSETS" | sed '/^$/d' | sort > expected-platform-assets.txt
          if ! diff -u expected-platform-assets.txt platform-assets.txt; then
            echo "::error::platform checksum assets do not match the CLI build matrix"
            exit 1
          fi
          printf '%s\n' "$ALLOWED_SYMBOL_CHECKSUM_ASSETS" | sed '/^$/d' | sort > allowed-symbol-assets.txt
          if [ -n "$(comm -13 allowed-symbol-assets.txt symbol-assets.txt)" ]; then
            echo "::error::release contains an unexpected debug-symbol checksum asset"
            comm -13 allowed-symbol-assets.txt symbol-assets.txt
            exit 1
          fi
          for required in \
            librefang-aarch64-apple-darwin-debug-symbols.tar.gz.sha256 \
            librefang-x86_64-apple-darwin-debug-symbols.tar.gz.sha256; do
            if ! grep -Fxq "$required" symbol-assets.txt; then
              echo "::error::required macOS debug-symbol checksum is missing: $required"
              exit 1
            fi
          done
          SYMBOLS=$(wc -l < symbol-assets.txt | tr -d ' ')
          if [ "$SYMBOLS" -lt 2 ] || [ "$SYMBOLS" -gt 4 ]; then
            echo "::error::expected 2-4 known debug-symbol checksum assets, got $SYMBOLS"
            exit 1
          fi
          if [ "$SYMBOLS" -lt 4 ]; then
            echo "::warning::only $SYMBOLS/4 debug-symbol checksum assets are present; Linux split debuginfo is best-effort"
          fi
          while IFS= read -r name; do
            echo "Fetching $name"
            gh release download "$RELEASE_TAG" --pattern "$name" --clobber
          done < asset-list.txt
          ls *.sha256 | sort | xargs awk 1 > ../SHA256SUMS
          cd ..
          echo "::group::SHA256SUMS"
          cat SHA256SUMS
          echo "::endgroup::"
      - name: Sign SHA256SUMS with cosign (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
      - name: Verify signature locally before upload
        run: |
          cosign verify-blob \
            --certificate SHA256SUMS.pem \
            --signature SHA256SUMS.sig \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS
      - name: Upload signed manifest to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            SHA256SUMS \
            SHA256SUMS.sig \
            SHA256SUMS.pem \
            --clobber

  cli_pypi:
    name: CLI / PyPI
    # Opt-in re-publish, and only for stable/LTS tags — never beta/rc.
    # Mirrors the guard on release.yml's cli_pypi: the `librefang` PyPI project has a 10 GB total-size quota that per-platform CLI binary wheels exhaust when pre-releases are published too.
    # A manual rebuild must not re-bloat it.
    # A tag is a pre-release when it carries any `-suffix` except `-lts`.
    if: ${{ inputs.include_pypi && (!contains(inputs.tag, '-') || endsWith(inputs.tag, '-lts')) }}
    needs: [cli_mac, cli_linux, cli_musl, cli_windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-pypi
    permissions:
      id-token: write   # OIDC trusted publishing to PyPI
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - name: Build CLI wheels (no upload)
        run: |
          VERSION="${TAG#v}"
          mkdir -p "${{ runner.temp }}/cli-pypi-dist"
          cargo xtask publish-pypi-binaries \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            --tag "${TAG}" \
            --build-only \
            --dist-dir "${{ runner.temp }}/cli-pypi-dist"
        env:
          TAG: ${{ inputs.tag }}
      - name: Publish CLI wheels to PyPI (OIDC)
        # OIDC trusted publishing — configure at:
        # pypi.org/manage/project/librefang/settings/publishing
        # workflow filename: release-cli.yml, environment: release-pypi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/cli-pypi-dist
          skip-existing: true
