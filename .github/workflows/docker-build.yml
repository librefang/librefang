name: Docker Build

# Catches Dockerfile / runtime breakage on main before it reaches the
# release pipeline. Past incidents — #3058 (logs dir) and #3259 (missing
# libdbus, blocked the entire v2026.4.27-beta6 image release) — both
# slipped through because the docker job in release.yml only fires on
# tag push.
#
# Build-only validation isn't enough: #3259 would still pass a pure
# `docker build` if we only fixed the builder stage and forgot the
# runtime SO. So we also boot the image and probe /api/health to catch
# missing runtime libs / entrypoint regressions.
#
# Runs on push-to-main only — running on every PR push burned runner
# minutes on builds gated by Cargo.lock / pnpm-lock churn that isn't
# authoritative until merge. Trigger manually with workflow_dispatch
# when a PR explicitly needs a pre-merge docker check.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.dockerignore'
      - 'crates/**'
      - 'xtask/**'
      - 'packages/**'
      - 'sdk/python/librefang/**'
      - 'deploy/**'
      - '.github/workflows/docker-build.yml'
      - '.github/scripts/docker-smoke.sh'
      - '.github/scripts/tests/docker-smoke.test.sh'
      # This workflow is the only place the Trivy composite action and its gate script actually execute — the ci.yml lane runs the script's self-test only.
      # Without these two entries an edit to either would first run on an unrelated future push that happens to touch the Dockerfile, turning `main` red with no link back to the change that broke it.
      - '.github/actions/trivy-image-scan/**'
      - 'scripts/check-image-vulns.py'
  workflow_dispatch:

permissions:
  contents: read
  # Trivy scan results are uploaded to code scanning so the runtime image's CVEs land in the Security tab next to the retained JSON / SARIF artifacts (#6694).
  # The upload step is guarded and non-fatal, so a fork without code scanning enabled still gets the scan, the summary, and the artifacts.
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: docker build + smoke
    # amd64 only — arm64 would double runtime for marginal extra coverage.
    # The release pipeline still builds both architectures at tag time.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image (load to local daemon)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: librefang:ci
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build

      - name: Boot container and probe liveness/readiness
        # First boot writes config and seeds the registry. The helper checks
        # liveness plus readiness and fails immediately if the process exits.
        run: sh .github/scripts/docker-smoke.sh

      - name: Container logs (always)
        if: always()
        run: docker logs librefang-ci 2>&1 || true

      - name: Cleanup
        if: always()
        run: docker rm -f librefang-ci 2>&1 || true

      # ── Vulnerability scan (#6694) ─────────────────────────────────────────
      # Scans the exact image the smoke test just booted: Debian packages from the bookworm base, the bundled Node.js / Python dependencies, and a secret sweep.
      # Runs after the boot probe rather than before it because a runtime image that will not start does not need a CVE report — the build failure is the finding.
      #
      # REPORT-ONLY.
      # The single enforcement threshold for the whole repository is the `fail-on` input of .github/actions/trivy-image-scan, which ships as `off`; see the comment on that input for what arming it means and why it is not armed yet.
      - name: Scan runtime image for vulnerabilities
        id: scan
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: librefang:ci
          platform: linux/amd64
          report-slug: main-linux-amd64
          report-dir: ${{ runner.temp }}/trivy-reports

      - name: Upload SARIF to code scanning
        # `!cancelled()` so a failed gate still publishes the findings that failed it.
        # The `conclusion != 'skipped'` guard keeps this quiet when an earlier step failed and no SARIF was ever written, and `continue-on-error` keeps a repository without code scanning enabled from turning a green scan red on the upload alone.
        if: ${{ !cancelled() && steps.scan.conclusion != 'skipped' && github.repository == 'librefang/librefang' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: ${{ runner.temp }}/trivy-reports/main-linux-amd64.sarif
          # Distinct per scanned image: code scanning replaces the previous
          # results for a category, so a shared one would discard everything
          # but the last upload.
          category: trivy-main-linux-amd64
