name: release-tag

# Manual release-tag creator. Issue #3304 1/N (non-destructive split).
#
# This is a workflow_dispatch-only stub that mirrors the tag-creation
# slice of release.yml's `tag_on_merge` + `create_release` jobs. It does
# NOT replace those jobs — release.yml remains the canonical entrypoint
# (auto-tagging via PR merge + release entry creation). This workflow is
# the manual fallback for re-tagging or fixing a botched tag without
# rerunning the full pipeline.
#
# Maintainer must configure the `release-tag` GitHub environment with
# at least one required reviewer before this workflow becomes useful in
# practice — see docs/operations/release.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: |
          Tag to create on the current main branch (e.g. v2026.5.4 or v2026.5.4-beta.1).
          Must match [workspace.package].version in Cargo.toml on main.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-tag-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create release tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-tag
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Verify tag format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # CalVer YYYY.M.PATCH with optional -beta.N / -rc.N / -lts suffix
          if ! printf '%s\n' "$VERSION" | grep -qE '^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(-(beta|rc)\.?[0-9]+|-lts)?$'; then
            echo "::error::tag '$VERSION' does not match expected CalVer pattern"
            exit 1
          fi

      - name: Verify tag matches workspace version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Same gate as release.yml `create_release` — the manifest
          # section must match the tag the maintainer is requesting.
          TAG="$VERSION"
          if ! WS_VERSION=$(python3 -c 'import sys, tomllib; data = tomllib.load(sys.stdin.buffer); print(data["workspace"]["package"]["version"])' < Cargo.toml); then
            echo "::error::could not parse [workspace.package].version from Cargo.toml"
            exit 1
          fi
          if [ -z "$WS_VERSION" ]; then
            echo "::error::[workspace.package].version is empty"
            exit 1
          fi
          if [ "${TAG#v}" != "$WS_VERSION" ]; then
            echo "::error::requested tag $TAG does not match [workspace.package].version $WS_VERSION"
            exit 1
          fi
          echo "Tag $TAG matches workspace version $WS_VERSION"

      - name: Verify tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag '$VERSION' already exists locally"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -Fq -- "$VERSION"; then
            echo "::error::tag '$VERSION' already exists on origin"
            exit 1
          fi

      - name: Create + push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Environment approval and validation can take long enough for main to advance.
          # Fail instead of tagging a stale checkout whose version was validated against an older manifest.
          git fetch --no-tags origin refs/heads/main
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          CURRENT_MAIN_SHA=$(git rev-parse FETCH_HEAD)
          if [ "$CHECKED_OUT_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "::error::main advanced from $CHECKED_OUT_SHA to $CURRENT_MAIN_SHA; rerun the workflow"
            exit 1
          fi
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -- "$VERSION"
          # Include a no-change main update in the atomic push. If main moves
          # after the fetch above, this refspec becomes non-fast-forward and
          # GitHub rejects both the branch ref and the new tag.
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$VERSION"
          echo "✓ Pushed tag $VERSION"
          echo "Note: this push will trigger release.yml on the tag — split workflows below are only needed if individual targets need to be re-run."
