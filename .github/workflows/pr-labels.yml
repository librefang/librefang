name: PR Labels

# Path-based area labels (e.g. `area/cli`, `area/dashboard`) keyed off
# `.github/labeler.yml`. The review-state labels (`ready-for-review` ↔
# `needs-changes`) are owned by `pr-status-labels.yml`, which queries
# the real review state via `listReviews` instead of trying to infer
# it from issue comments or treating every author push as
# "all-resolved" — see librefang/librefang#3262 for the bug that
# motivated removing the inference path.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# `actions/labeler` runs with `sync-labels: true`, so each run recomputes the complete area-label set from the PR's changed paths and the newest run supersedes the older one.
# `pull_request_target` reports `github.ref` as the base branch (`refs/heads/main`) for every PR, so the group keys on the PR number instead — a ref-keyed group would let one PR's run cancel another's.
concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write


jobs:
  # ── Area labels based on changed file paths ───────────────────────
  area:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
