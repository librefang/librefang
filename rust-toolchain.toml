# Pin local development to the workspace MSRV declared in Cargo.toml.
# scripts/check-toolchain-versions.sh keeps this file, mise, and the lockfile
# synchronized; CI also compiles workspace libraries with this exact version.
#
# `profile = "minimal"` skips `rust-docs` (~150 MB) which neither CI
# nor day-to-day development needs. Add it locally with
# `rustup component add rust-docs` if you want offline std docs.

[toolchain]
channel = "1.94.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
